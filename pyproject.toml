[project]
name = "journey-core"
version = "0.1.0"
description = "Núcleo determinístico de jornada de saúde: consentimento, protocolo data-driven, eventos e elegibilidade de follow-up."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português usam acentos e travessões

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert e salts fictícios são esperados em testes
"app/models/patient.py" = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
